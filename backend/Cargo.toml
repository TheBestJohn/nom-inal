[package]
name = "nom-inal"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Nutrition, macro, recipe and weight tracking API"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "chrono",
  "macros",
  "migrate",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
jsonwebtoken = "9"
# API keys are server-generated 256-bit secrets, so they are digested rather
# than password-hashed; see the note on api_keys.token_hash in migration 0006.
sha2 = "0.10"
base64 = "0.22"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-stream = "0.3"
# Decoding and re-encoding uploads is what bounds their size and, just as
# importantly, drops EXIF — progress photos routinely carry GPS coordinates.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
validator = { version = "0.19", features = ["derive"] }

utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

# MCP over Streamable HTTP, served at /mcp by this same process. Tools are
# assembled from the OpenAPI registry at startup rather than declared with the
# macros, so only the server and transport features are needed.
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
