name: Release

# Publishes to the GitHub Container Registry, which is what "GitHub Packages"
# means for container images. It is the right home for this: authentication is
# the workflow's own GITHUB_TOKEN, so there are no registry credentials to
# store, and the images inherit the repository's visibility.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          - image: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase names, and the owner here is not lowercase.
      - name: Resolve the image name
        id: name
        run: echo "value=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.value }}
          # A tag publishes its version and the moving majors under it; main
          # publishes `edge`, so the tip is installable without cutting a
          # release. `latest` only ever moves on a real tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=nom-inal ${{ matrix.image }}
            org.opencontainers.image.description=Self-hosted nutrition tracking — weight, calories, macros, recipes
            org.opencontainers.image.licenses=MIT

      # The API bakes the commit and build time into /api/v1/health, so an
      # instance can say exactly what it is running. Computed here rather than
      # in the Dockerfile, which has no git and should not need one. Only the
      # API consumes them; the web image is static files and gets nothing,
      # which also keeps buildx from warning about unconsumed args.
      - name: Stamp the build
        id: stamp
        run: |
          if [ "${{ matrix.image }}" = api ]; then
            {
              echo 'args<<EOF'
              echo "GIT_SHA=${{ github.sha }}"
              echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # arm64 matters for a self-hosted app: plenty of these run on a Pi or
          # an ARM VPS. Both Dockerfiles cross-compile rather than emulate, so
          # this costs build time rather than multiplying it.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.stamp.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summarise
        run: |
          {
            echo "### \`${{ matrix.image }}\` published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
