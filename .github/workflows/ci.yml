name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

  api-smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nominal
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Exercises the SQL itself. Queries are runtime-checked, so a typo in a
      # query only surfaces when it executes — a compile is not enough.
      - name: Run migrations and exercise every endpoint
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nominal
          JWT_SECRET: ci-secret-not-used-anywhere-real
          BIND_ADDR: 127.0.0.1:8080
        run: |
          cargo build
          ./target/debug/nom-inal &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
          bash ../scripts/smoke.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Formatting
        run: npx prettier --check "src/**/*.{ts,tsx}"
      - name: Typecheck and build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    # Job-scoped, not step-scoped: the compose file declares these as required,
    # so every `docker compose` call needs them — including the log dump and the
    # teardown, which only run once something has already gone wrong.
    env:
      POSTGRES_PASSWORD: ci-password
      JWT_SECRET: ci-secret-not-used-anywhere-real
      WEB_PORT: '8088'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bring the whole stack up and check it serves
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8088/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/api/v1/health
          # SPA fallback: a client-side route must serve the app shell, not 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/weight)" = 200

          # A shared recipe's link has to preview as that recipe. /r/ is the one
          # path nginx hands to the API instead of the SPA, and only the
          # assembled stack can show that it does: served the app shell instead,
          # every shared link would unfurl as the same generic site card, which
          # is the bug this whole address exists to fix.
          J='import sys,json;d=json.load(sys.stdin);print(eval(sys.argv[1],{"d":d}))'
          API=http://127.0.0.1:8088/api/v1
          EMAIL="ci-$(date +%s)@example.test"
          TOKEN=$(curl -fsS -X POST "$API/auth/register" -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"ci-test-password\",\"display_name\":\"CI\"}" \
            | python3 -c "$J" "d['access_token']")
          FOOD=$(curl -fsS -X POST "$API/foods" -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d '{"name":"CI oats","calories_kcal":379,"protein_g":13.2,"carbs_g":67.7,"fat_g":6.5}' \
            | python3 -c "$J" "d['id']")
          SLUG=$(curl -fsS -X POST "$API/recipes" -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"CI Porridge\",\"servings\":2,\"is_public\":true,\"items\":[{\"food_id\":\"$FOOD\",\"quantity_g\":80}]}" \
            | python3 -c "$J" "d['slug']")

          PAGE=$(curl -fsS -D /tmp/r.headers "http://127.0.0.1:8088/r/$SLUG")
          grep -qi '^content-type: text/html' /tmp/r.headers
          echo "$PAGE" | grep -q '<title>CI Porridge — nom-inal</title>'
          echo "$PAGE" | grep -q 'property="og:title" content="CI Porridge"'
          echo "$PAGE" | grep -q '<script type="application/ld+json">'
          CARD=$(echo "$PAGE" | sed -n 's|.*property="og:image" content="\([^"]*\)".*|\1|p')
          test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$CARD")" = "200 image/png"

          # Un-sharing takes the page with it, through nginx as everywhere else.
          PRIV=$(curl -fsS -X POST "$API/recipes" -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"name\":\"CI Private\",\"servings\":1,\"items\":[{\"food_id\":\"$FOOD\",\"quantity_g\":80}]}" \
            | python3 -c "$J" "d['slug']")
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8088/r/$PRIV")" = 404

      # Without this, a container that dies at boot shows up only as
      # "dependency failed to start ... is unhealthy", with no reason.
      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
