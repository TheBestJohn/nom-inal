server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serving the API from the same origin as the SPA means no CORS
    # preflights and no chance of the browser and the API disagreeing
    # about cookies or origins.
    location /api/ {
        proxy_pass http://api:8080;
        # nginx caps request bodies at 1 MB by default, which a photo upload
        # exceeds immediately. The API enforces the real limit.
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MCP is served by the API on the same origin as the SPA, so an assistant
    # is configured with this instance's URL plus `/mcp` and nothing else.
    # Responses may be server-sent events, which buffering would hold back.
    location = /mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Vite emits content-hashed asset filenames, so these are safe to cache
    # forever; a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: any unknown path is a React route, not a 404.
    # index.html itself must never be cached or users get a stale app shell
    # pointing at assets that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
